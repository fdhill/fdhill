name: Update Dot Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # tiap hari jam 00:00 UTC (07:00 WIB)
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: fdhill
        run: node scripts/generate-dot-graph.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-graph.svg
          git diff --quiet --cached || git commit -m "chore: update contribution graph"
          git push
