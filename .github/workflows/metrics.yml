name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 00:00 UTC (± sama waktu dgn dot-graph kamu)
  workflow_dispatch:        # bisa trigger manual dari tab Actions

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # --- base stats + streak (pengganti github-readme-stats & streak-stats) ---
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14

          # --- opsional tapi bagus untuk profile ---
          plugin_streak: yes
          plugin_stars: yes
          plugin_stars_limit: 6

          # --- tema, biar mirip radical ---
          config_display: large
          config_timezone: Asia/Jakarta
